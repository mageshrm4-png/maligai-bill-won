<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>மளிகை பில்</title>
<style>
:root{--g:#17794b;--gd:#14623c;--y:#f2b705;--ink:#1c2a2e;--mu:#667a72;--bg:#f3f6f1;--ln:#dde5dc;--red:#b3261e;--w:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,Roboto,"Noto Sans Tamil",sans-serif;font-size:16px;line-height:1.35}
#app{display:flex;flex-direction:column;height:100%}
header{background:var(--g);color:#fff;padding:12px 16px}
header b{font-size:22px}
header div{font-size:12px;opacity:.85}
main{flex:1;overflow-y:auto;padding:12px 12px 140px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--w);border-top:1px solid var(--ln);z-index:5}
nav button{flex:1;border:0;background:none;padding:7px 0 8px;font-size:10.5px;color:var(--mu)}
nav button i{display:block;font-style:normal;font-size:20px}
nav button.on{color:var(--g);font-weight:700}
.inp{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:8px;font-size:16px;background:var(--w);color:var(--ink);margin:0 0 8px}
.inp:focus{outline:2px solid var(--g);border-color:var(--g)}
label{display:block;font-size:13px;color:var(--mu);margin:4px 0 3px}
.btn{border:0;border-radius:8px;padding:12px 14px;font-size:16px;font-weight:600;background:var(--g);color:#fff}
.btn.ghost{background:#e4efe7;color:var(--gd)}
.btn.red{background:var(--red)}
.btn.line{background:var(--w);color:var(--ink);border:1px solid var(--ln)}
.btn.full{width:100%;margin:0 0 8px}
.btns{display:flex;gap:8px;margin:8px 0}
.btns .btn{flex:1;padding:12px 6px;font-size:15px}
.list{background:var(--w);border-top:1px solid var(--ln)}
.row{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--ln)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;overflow-wrap:anywhere}
.row .t small{color:var(--mu)}
.row .amt{font-weight:700;white-space:nowrap}
.plus{width:40px;height:40px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:24px;line-height:1}
.badge{min-width:30px;text-align:center;background:var(--y);color:var(--ink);font-weight:700;border-radius:12px;padding:2px 8px;font-size:14px}
.ico{border:0;background:none;font-size:20px;padding:6px 8px}
.chips{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.chip{border:1px solid var(--ln);background:var(--w);border-radius:18px;padding:7px 14px;font-size:14px;color:var(--ink)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.empty{padding:28px 16px;text-align:center;color:var(--mu)}
.bar{position:fixed;left:0;right:0;bottom:56px;z-index:4;background:var(--ink);color:#fff;display:none;align-items:center;justify-content:space-between;padding:10px 14px}
.bar.show{display:flex}
.bar b{font-size:20px;color:var(--y)}
.bar .btn{background:var(--y);color:var(--ink)}
.mw{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}
.mw.show{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow-y:auto;background:var(--w);border-radius:16px 16px 0 0;padding:16px}
.sheet h3{margin:0 0 10px;font-size:18px}
.cf{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;align-items:center;justify-content:center;padding:24px}
.cf.show{display:flex}
.cf div{background:var(--w);border-radius:12px;padding:20px;width:100%;max-width:340px}
.cf p{margin:0 0 16px;font-size:17px}
.crow{border-bottom:1px solid var(--ln);padding:10px 0}
.crow .h{display:flex;justify-content:space-between;align-items:center}
.crow .c{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.crow .c input{width:78px;padding:8px;margin:0;text-align:center}
.crow .c button{width:36px;height:36px;border-radius:8px;border:1px solid var(--ln);background:#f3f6f1;font-size:20px}
.crow .c .a{margin-left:auto;font-weight:700;font-size:17px}
.tot{background:var(--ink);color:#fff;border-radius:10px;padding:12px 14px;margin:12px 0}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .g{font-size:26px;font-weight:700;color:var(--y);border-top:1px solid #405058;margin-top:6px;padding-top:8px}
.tot input{width:90px;text-align:right;padding:6px;margin:0}
.rc{font-family:"Courier New",monospace;font-size:14px;color:#000;background:#fff;padding:8px 4px}
.rc table{width:100%;border-collapse:collapse}
.rc td{padding:3px 0;vertical-align:top}
.rc .r{text-align:right;white-space:nowrap}
.rc .c{text-align:center}
.rc hr{border:0;border-top:1px dashed #000;margin:8px 0}
.stat{display:flex;gap:8px;margin-bottom:10px}
.stat div{flex:1;background:var(--w);border:1px solid var(--ln);border-radius:10px;padding:12px}
.stat small{color:var(--mu);display:block}
.stat b{font-size:22px}
.stat .big{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat .big b{color:var(--y)}
h4{margin:16px 0 6px;font-size:15px;color:var(--mu)}

.alert{background:#fde8e6;color:var(--red);border:1px solid #f0b3ad;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-weight:600}
.alert small{display:block;font-weight:400;color:#7a2a24}
.lowt{color:var(--red);font-weight:700}
.okt{color:var(--gd)}
.stat .warn{background:#fde8e6;border-color:#f0b3ad}
.stat .warn b{color:var(--red)}
.row.lowrow{background:#fff6f5}

.minus{width:40px;height:40px;border-radius:50%;border:0;background:#fde8e6;color:var(--red);font-size:20px;font-weight:700}
.seg{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden;margin:0 0 8px}
.seg button{border:0;background:#fff;padding:0 14px;font-size:16px;color:var(--ink)}
.seg button.on{background:var(--g);color:#fff;font-weight:700}
.crow .c select{width:auto;margin:0;padding:8px 4px;font-size:15px}
.crow .rm{font-size:14px;color:var(--red);font-weight:600}
.crow small{color:var(--mu)}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;z-index:50;display:none;max-width:85%;text-align:center}
#printArea{display:none}
@media print{
  #app,nav,.bar,.mw,.cf,#toast{display:none!important}
  #printArea{display:block!important}
  body{background:#fff}
}
</style>
</head>
<body>
<div id="app">
  <header><b id="hShop">மளிகை கடை</b><div id="hSub"></div></header>
  <main id="main"></main>
</div>
<div class="bar" id="bar"><div><small id="barN"></small><br><b id="barT"></b></div><button class="btn" onclick="openCart()">பில் பார்க்க</button></div>
<nav id="nav">
  <button data-t="bill"><i>🧾</i>பில்</button>
  <button data-t="products"><i>📦</i>சரக்கு</button>
  <button data-t="history"><i>🕘</i>வரலாறு</button>
  <button data-t="credit"><i>📒</i>கடன்</button>
  <button data-t="report"><i>📊</i>அறிக்கை</button>
  <button data-t="settings"><i>⚙️</i>அமைப்பு</button>
</nav>
<div class="mw" id="mw"><div class="sheet" id="sheet"></div></div>
<div class="cf" id="cf"><div><p id="cfMsg"></p><div style="display:flex;gap:8px;padding:0;background:none"><button class="btn line" style="flex:1" id="cfNo">வேண்டாம்</button><button class="btn red" style="flex:1" id="cfYes">சரி</button></div></div></div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
/* ---------- storage ---------- */
var KEY='maligai_data_v1';
var store={
  get:function(){try{return window.Android?Android.load(KEY):localStorage.getItem(KEY)}catch(e){return null}},
  set:function(v){try{if(window.Android)Android.save(KEY,v);else localStorage.setItem(KEY,v)}catch(e){}}
};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function mk(n,p,u,c,s,m){var o={id:uid(),name:n,price:p,unit:u,cost:c||0};if(typeof s==='number'){o.stock=s;o.min=(m==null?5:m)}return o}
function defaults(){
  return{
    shop:{name:'மளிகை கடை',addr:'',phone:'',footer:'நன்றி! மீண்டும் வருக!'},
    products:[mk('பச்சரிசி',60,'kg',52,40,10),mk('இட்லி அரிசி',50,'kg',43,30,10),mk('சர்க்கரை',45,'kg',40,25,8),mk('துவரம் பருப்பு',150,'kg',135,20,5),
      mk('உளுந்தம் பருப்பு',140,'kg',125,15,5),mk('கடலைப் பருப்பு',100,'kg',88,15,5),mk('உப்பு',20,'pkt',16,60,15),mk('மிளகாய் தூள்',60,'pkt',48,30,8),
      mk('மஞ்சள் தூள்',30,'pkt',23,30,8),mk('நல்லெண்ணெய்',400,'L',360,12,4),mk('கடலை எண்ணெய்',190,'L',170,20,6),mk('சோப்பு',35,'pcs',29,48,12)],
    bills:[],led:[],nextNo:1
  };
}
var DB;
try{var raw=store.get();DB=raw?JSON.parse(raw):defaults()}catch(e){DB=defaults()}
if(!DB||!DB.products||!DB.bills||!DB.shop){DB=defaults()}
if(!DB.led)DB.led=[];
if(!DB.phones)DB.phones={};
function save(){store.set(JSON.stringify(DB))}
save();

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function money(n){return '₹'+Number(num(n).toFixed(2)).toLocaleString('en-IN')}
function q(n){return Number(num(n).toFixed(3))}
function qtyTxt(n,u){n=num(n);
  if(u==='kg')return n<1?q(n*1000)+' கிராம்':q(n)+' கிலோ';
  if(u==='L')return n<1?q(n*1000)+' மி.லி':q(n)+' லிட்டர்';
  return q(n)+' '+UNITS[u]}
function pad(n){return String(n).padStart(2,'0')}
function dstr(t){var d=new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()}
function tstr(t){var d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())}
function dkey(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
var UNITS={kg:'கிலோ',L:'லிட்டர்',pcs:'எண்',pkt:'பாக்கெட்',dz:'டஜன்'};
var PAY={cash:'ரொக்கம்',upi:'UPI',credit:'கடன்'};
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},Math.max(2000,String(m).length*70))}
function ask(msg,yes){
  return new Promise(function(res){
    $('#cfMsg').textContent=msg;$('#cfYes').textContent=yes||'சரி';
    $('#cf').classList.add('show');
    function done(v){$('#cf').classList.remove('show');$('#cfYes').onclick=null;$('#cfNo').onclick=null;ask.cancel=null;res(v)}
    $('#cfYes').onclick=function(){done(true)};
    $('#cfNo').onclick=function(){done(false)};
    ask.cancel=function(){done(false)};
  });
}
function modal(html){$('#sheet').innerHTML=html;$('#mw').classList.add('show');$('#sheet').scrollTop=0}
function closeModal(){$('#mw').classList.remove('show');$('#sheet').innerHTML=''}
function modalOpen(){return $('#mw').classList.contains('show')}
window.handleBack=function(){
  if($('#cf').classList.contains('show')){ask.cancel&&ask.cancel();return true}
  if(modalOpen()){closeModal();return true}
  if(tab!=='bill'){go('bill');return true}
  return false;
};
$('#mw').addEventListener('click',function(e){if(e.target===this)closeModal()});

/* ---------- state ---------- */
var tab='bill';
var cart=[];
var editNo=null,editTs=null;
var st={cf:'owe',cq:'',pq:'',mq:'',mf:'all',hf:'today',hd:'',hq:'',rp:'today'};

function go(t){
  tab=t;
  document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
  render();
}
document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){closeModal();go(b.dataset.t)}});

function render(){
  $('#hShop').textContent='🛒 '+(DB.shop.name||'மளிகை கடை');
  $('#hSub').textContent={bill:'புதிய பில்',products:'சரக்கு & பொருட்கள்',history:'பில் வரலாறு',credit:'கடன் கணக்கு',report:'விற்பனை அறிக்கை',settings:'கடை அமைப்புகள்'}[tab];
  ({bill:rBill,products:rProducts,history:rHistory,credit:rCredit,report:rReport,settings:rSettings})[tab]();
  updateBar();
  $('#main').scrollTop=0;
}

/* ---------- SMS / WHATSAPP ---------- */
function cleanPhone(s){var d=String(s||'').replace(/\D/g,'');if(d.length===12&&d.indexOf('91')===0)d=d.slice(2);if(d.length===11&&d.charAt(0)==='0')d=d.slice(1);return d.length===10?d:''}
function smsMode(){return DB.shop.sms||'credit'}
function sendSms(ph,text){if(window.Android&&Android.sendSms)Android.sendSms(ph,text);else toast('SMS (சோதனை): '+ph)}
function waSend(ph,text){if(window.Android&&Android.whatsapp)Android.whatsapp(ph,text);else toast('WhatsApp (சோதனை): '+ph)}
function billSms(b){
  var t=DB.shop.name+'\nபில் #'+b.no+' ('+dstr(b.ts)+')\nமொத்தம்: '+money(b.total)+' ('+PAY[b.pay]+')';
  if(b.pay==='credit'){var c=custMap()[ckey(b.cust)];if(c)t+='\nமொத்த கடன் பாக்கி: '+money(c.bal)}
  return t+'\nநன்றி!';
}
function autoBillSms(b){
  var ph=cleanPhone(b.phone),m=smsMode();
  if(!ph||m==='off'||(m==='credit'&&b.pay!=='credit'))return false;
  sendSms(ph,billSms(b));return true;
}
function sendBillTo(no,how){
  var b=getBill(no);if(!b)return;var ph=cleanPhone(b.phone);
  if(!ph){toast('போன் எண் இல்லை / சரியில்லை');return}
  if(how==='sms')sendSms(ph,billSms(b));else waSend(ph,billText(b));
}

/* ---------- STOCK HELPERS ---------- */
function isTracked(p){return typeof p.stock==='number'}
function isLow(p){return isTracked(p)&&p.stock<=num(p.min)}
function findP(id){return DB.products.filter(function(x){return x.id===id})[0]}
function adjStock(id,d){var p=id&&findP(id);if(p&&isTracked(p))p.stock=q(p.stock+d)}
function lowList(){return DB.products.filter(isLow)}
function credTot(){var m=custMap();return Object.keys(m).reduce(function(s,k){return s+Math.max(0,m[k].bal)},0)}
function stockStats(){
  var s={tracked:0,low:0,costV:0,saleV:0};
  DB.products.forEach(function(p){
    if(!isTracked(p))return;
    s.tracked++;if(isLow(p))s.low++;
    var n=Math.max(0,p.stock);
    s.saleV+=n*num(p.price);
    s.costV+=n*(num(p.cost)>0?num(p.cost):num(p.price));
  });
  return s;
}
function stockLine(p){
  if(!isTracked(p))return '';
  var t='இருப்பு: '+qtyTxt(p.stock,p.unit);
  if(p.stock<=0)return '<br><small class="lowt">⚠️ '+t+' — தீர்ந்தது</small>';
  if(isLow(p))return '<br><small class="lowt">⚠️ '+t+' — குறைவு</small>';
  return '<br><small class="okt">'+t+'</small>';
}

/* ---------- BILL TAB ---------- */
function rBill(){
  var lw=lowList(),banner='';
  if(lw.length){
    banner='<div class="alert" onclick="st.mf=\'low\';go(\'products\')">⚠️ '+lw.length+' பொருட்கள் குறைவு / தீர்ந்தது<small>'+
      lw.slice(0,4).map(function(p){return esc(p.name)}).join(', ')+(lw.length>4?' ...':'')+' — பார்க்க தொடவும்</small></div>';
  }
  $('#main').innerHTML=banner+
   '<input class="inp" id="pq" placeholder="🔍 பொருள் தேடு" value="'+esc(st.pq)+'">'+
   '<button class="btn ghost full" onclick="customItem()">➕ பட்டியலில் இல்லாத பொருள்</button>'+
   '<div class="list" id="plist"></div>';
  $('#pq').oninput=function(){st.pq=this.value;fillPlist()};
  fillPlist();
}
function sortedProducts(){return DB.products.slice().sort(function(a,b){return a.name.localeCompare(b.name,'ta')})}
function cartOf(id){return cart.filter(function(x){return x.pid===id})[0]}
function isBulk(u){return u==='kg'||u==='L'}
function fillPlist(){
  if(!$('#plist'))return;
  var k=st.pq.trim().toLowerCase();
  var l=sortedProducts().filter(function(p){return p.name.toLowerCase().indexOf(k)>=0});
  if(!l.length){$('#plist').innerHTML='<div class="empty">பொருள் இல்லை.<br>"சரக்கு" பகுதியில் சேர்க்கவும்.</div>';return}
  $('#plist').innerHTML=l.map(function(p){
    var c=cartOf(p.id),bulk=isBulk(p.unit);
    return '<div class="row'+(isLow(p)?' lowrow':'')+'" onclick="addToCart(\''+p.id+'\')"><div class="t"><b>'+esc(p.name)+'</b><small>'+money(p.price)+' / '+(bulk?(p.unit==='kg'?'கிலோ':'லிட்டர்'):UNITS[p.unit])+'</small>'+stockLine(p)+'</div>'+
      (c?'<span class="badge">'+qtyTxt(c.qty,c.unit)+'</span><button class="minus" onclick="event.stopPropagation();lessItem(\''+p.id+'\')">'+(bulk?'✕':'−')+'</button>':'')+
      '<button class="plus">'+(bulk?'⚖':'+')+'</button></div>';
  }).join('');
}
function lessItem(id){
  var c=cartOf(id);if(!c)return;
  if(isBulk(c.unit)||c.qty<=1)cart=cart.filter(function(x){return x!==c});
  else c.qty=q(c.qty-1);
  fillPlist();updateBar();toast(isBulk(c.unit)||c.qty<=1?'நீக்கப்பட்டது':'ஒன்று குறைந்தது');
}
function addToCart(id){
  var p=findP(id);if(!p)return;
  if(isBulk(p.unit)){openQty(id);return}
  var c=cartOf(id);
  if(c)c.qty=q(c.qty+1);else{c={pid:p.id,name:p.name,unit:p.unit,price:p.price,cost:num(p.cost),qty:1};cart.push(c)}
  if(isTracked(p)&&c.qty>p.stock)toast('⚠️ இருப்பு '+qtyTxt(p.stock,p.unit)+' மட்டுமே');
  fillPlist();updateBar();
}
/* gram / kg quick entry */
var qm=null;
function openQty(id){
  var p=findP(id);if(!p)return;
  var c=cartOf(id),kg=p.unit==='kg';
  var sub=kg?'கிராம்':'மி.லி',bs=kg?'கிலோ':'லிட்டர்';
  qm={id:id,mode:'sub'};
  var chips=[[100,'sub'],[250,'sub'],[500,'sub'],[1,'base'],[2,'base']].map(function(x){
    return '<button class="chip" onclick="qChip('+x[0]+',\''+x[1]+'\')">'+x[0]+' '+(x[1]==='sub'?sub:bs)+'</button>'}).join('');
  modal('<h3>'+esc(p.name)+'</h3><div style="color:var(--mu);margin:-6px 0 10px">'+money(p.price)+' / '+bs+(c?' · பில்லில் இப்போது: <b>'+qtyTxt(c.qty,c.unit)+'</b>':'')+'</div>'+
   '<div class="chips">'+chips+'</div>'+
   '<div style="display:flex;gap:8px;align-items:flex-start"><input class="inp" id="qv" type="number" inputmode="decimal" step="any" placeholder="அளவு" style="flex:1;font-size:22px" oninput="qCalc()">'+
   '<div class="seg" style="height:50px"><button id="qm_sub" class="on" onclick="qMode(\'sub\')">'+sub+'</button><button id="qm_base" onclick="qMode(\'base\')">'+bs+'</button></div></div>'+
   '<div class="tot"><div class="g" style="margin:0;border:0;padding:0"><span id="qtxt">—</span><span id="qamt">₹0</span></div></div>'+
   '<div class="btns"><button class="btn line" onclick="closeModal()">மூடு</button><button class="btn" onclick="qAdd()">பில்லில் சேர்</button></div>');
  setTimeout(function(){var e=$('#qv');if(e)e.focus()},60);
}
function qMode(m){qm.mode=m;$('#qm_sub').classList.toggle('on',m==='sub');$('#qm_base').classList.toggle('on',m==='base');qCalc()}
function qChip(v,m){$('#qv').value=v;qMode(m)}
function qBase(){var v=num($('#qv').value);return qm.mode==='sub'?v/1000:v}
function qCalc(){
  var p=findP(qm.id),b=qBase();
  $('#qtxt').textContent=b>0?qtyTxt(b,p.unit):'—';
  $('#qamt').textContent=money(b*num(p.price));
}
function qAdd(){
  var p=findP(qm.id),b=q(qBase());
  if(!(b>0)){toast('அளவு உள்ளிடவும்');return}
  var c=cartOf(p.id);
  if(c)c.qty=q(c.qty+b);else{c={pid:p.id,name:p.name,unit:p.unit,price:p.price,cost:num(p.cost),qty:b,du:qm.mode};cart.push(c)}
  var warn=isTracked(p)&&c.qty>p.stock;
  closeModal();fillPlist();updateBar();
  toast(warn?'⚠️ இருப்பு '+qtyTxt(p.stock,p.unit)+' மட்டுமே':'சேர்க்கப்பட்டது: '+qtyTxt(b,p.unit));
}
function cartSub(){return cart.reduce(function(s,i){return s+num(i.qty)*num(i.price)},0)}
function updateBar(){
  var b=$('#bar');
  if(cart.length&&!modalOpen()){b.classList.add('show');$('#barN').textContent=cart.length+' பொருட்கள்'+(editNo?' · பில் #'+editNo+' திருத்தம்':'');$('#barT').textContent=money(cartSub())}
  else b.classList.remove('show');
}
function customItem(){
  modal('<h3>தனிப் பொருள் சேர்</h3>'+
   '<label>பொருள் பெயர்</label><input class="inp" id="cn">'+
   '<label>விலை (₹)</label><input class="inp" id="cp" type="number" inputmode="decimal">'+
   '<label>அளவு</label><input class="inp" id="cq" type="number" inputmode="decimal" value="1">'+
   '<label>அலகு</label><select class="inp" id="cu">'+unitOpts('pcs')+'</select>'+
   '<div class="btns"><button class="btn line" onclick="closeModal()">மூடு</button><button class="btn" onclick="doCustom()">பில்லில் சேர்</button></div>');
}
function doCustom(){
  var n=$('#cn').value.trim(),p=num($('#cp').value),qq=num($('#cq').value);
  if(!n){toast('பெயர் எழுதவும்');return}
  if(qq<=0){toast('அளவு சரியில்லை');return}
  cart.push({pid:null,name:n,unit:$('#cu').value,price:p,cost:0,qty:qq});
  closeModal();if(tab==='bill')fillPlist();updateBar();toast('சேர்க்கப்பட்டது');
}
function unitOpts(sel){return Object.keys(UNITS).map(function(k){return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+UNITS[k]+'</option>'}).join('')}

/* ---------- CART / CHECKOUT ---------- */
var cartMeta={disc:0,cust:'',phone:'',pay:'cash'};
function openCart(){
  if(!cart.length){toast('பொருள் எதுவும் இல்லை');return}
  var rows=cart.map(function(it,i){
    var bulk=isBulk(it.unit),kg=it.unit==='kg';
    if(bulk&&!it.du)it.du=it.qty<1?'sub':'base';
    var val=(bulk&&it.du==='sub')?q(it.qty*1000):q(it.qty);
    var uctl=bulk?'<select class="inp" onchange="setDu('+i+',this.value)"><option value="sub"'+(it.du==='sub'?' selected':'')+'>'+(kg?'கிராம்':'மி.லி')+'</option><option value="base"'+(it.du==='base'?' selected':'')+'>'+(kg?'கிலோ':'லிட்டர்')+'</option></select>':'<span>'+UNITS[it.unit]+'</span>';
    return '<div class="crow"><div class="h"><b>'+esc(it.name)+'</b><button class="ico rm" onclick="rmItem('+i+')">🗑️ நீக்கு</button></div>'+
    '<div class="c"><button onclick="stepQty('+i+',-1)">−</button>'+
    '<input class="inp" type="number" inputmode="decimal" step="any" id="q'+i+'" value="'+val+'" oninput="setQty('+i+',this.value)">'+
    '<button onclick="stepQty('+i+',1)">+</button>'+uctl+'<span>×</span>'+
    '<input class="inp" type="number" inputmode="decimal" step="any" value="'+num(it.price)+'" oninput="setPrice('+i+',this.value)">'+
    '<span class="a" id="a'+i+'">'+money(it.qty*it.price)+'</span></div>'+
    (bulk?'<small>விலை: ₹ / '+(kg?'கிலோ':'லிட்டர்')+'</small>':'')+'</div>';
  }).join('');
  modal('<h3>'+(editNo?'பில் #'+editNo+' திருத்தம்':'புதிய பில்')+'</h3>'+rows+
   '<div class="tot"><div><span>மொத்தம்</span><span id="tSub"></span></div>'+
   '<div><span>தள்ளுபடி (₹)</span><input class="inp" id="tDisc" type="number" inputmode="decimal" value="'+(cartMeta.disc||'')+'" oninput="cartMeta.disc=num(this.value);calc()"></div>'+
   '<div class="g"><span>கட்டணம்</span><span id="tTot"></span></div></div>'+
   '<label>பணம் செலுத்தும் முறை</label><div class="chips" id="payc">'+
     [['cash','💵 '],['upi','📱 '],['credit','📒 ']].map(function(x){return '<button class="chip'+(x[0]===cartMeta.pay?' on':'')+'" data-p="'+x[0]+'" onclick="setPay(\''+x[0]+'\')">'+x[1]+PAY[x[0]]+'</button>'}).join('')+'</div>'+
   '<label>வாடிக்கையாளர் பெயர் (கடன் என்றால் கட்டாயம்)</label><input class="inp" id="mc" list="cl" value="'+esc(cartMeta.cust)+'" oninput="cartMeta.cust=this.value;autoPhone()"><datalist id="cl">'+
     custNames().map(function(n){return '<option value="'+esc(n)+'">'}).join('')+'</datalist>'+
   '<label>தொலைபேசி (SMS போக)</label><input class="inp" id="mp" type="tel" inputmode="numeric" value="'+esc(cartMeta.phone)+'" oninput="cartMeta.phone=this.value">'+
   '<div class="btns"><button class="btn line" onclick="clearCart()">அழி</button><button class="btn ghost" onclick="closeModal();updateBar()">பொருள் சேர்</button><button class="btn" onclick="saveBill()">பில் சேமி</button></div>');
  calc();updateBar();
}
function setPay(k){cartMeta.pay=k;document.querySelectorAll('#payc .chip').forEach(function(c){c.classList.toggle('on',c.dataset.p===k)})}
function phoneFor(name){
  var k=ckey(name);if(!k)return '';
  if(DB.phones&&DB.phones[k])return DB.phones[k];
  for(var i=DB.bills.length-1;i>=0;i--){var b=DB.bills[i];if(ckey(b.cust)===k&&b.phone)return b.phone}
  return '';
}
function autoPhone(){var ph=phoneFor(cartMeta.cust);if(ph&&!cartMeta.phone){cartMeta.phone=ph;var e=$('#mp');if(e)e.value=ph}}
function calc(){
  cart.forEach(function(it,i){var e=$('#a'+i);if(e)e.textContent=money(it.qty*it.price)});
  var s=cartSub(),d=num(cartMeta.disc),t=Math.max(0,s-d);
  if($('#tSub')){$('#tSub').textContent=money(s);$('#tTot').textContent=money(t)}
}
function setQty(i,v){var n=num(v);cart[i].qty=(isBulk(cart[i].unit)&&cart[i].du==='sub')?q(n/1000):n;calc()}
function setPrice(i,v){cart[i].price=num(v);calc()}
function showQ(i){var it=cart[i],e=$('#q'+i);if(e)e.value=(isBulk(it.unit)&&it.du==='sub')?q(it.qty*1000):q(it.qty)}
function stepQty(i,d){
  var it=cart[i],step=1;
  if(isBulk(it.unit))step=it.du==='sub'?0.1:0.5;
  it.qty=Math.max(0,q(it.qty+d*step));
  showQ(i);calc();
}
function setDu(i,m){cart[i].du=m;showQ(i);calc()}
function rmItem(i){cart.splice(i,1);if(!cart.length){closeModal();resetCartMeta();if(tab==='bill')fillPlist();updateBar()}else openCart()}
async function clearCart(){
  if(await ask('இந்த பில்லில் உள்ள எல்லாவற்றையும் அழிக்கவா?','அழி')){cart=[];editNo=null;editTs=null;resetCartMeta();closeModal();if(tab==='bill')fillPlist();updateBar()}
}
function resetCartMeta(){cartMeta={disc:0,cust:'',phone:'',pay:'cash'};editNo=null;editTs=null}
async function saveBill(){
  var items=cart.filter(function(i){return num(i.qty)>0});
  if(!items.length){toast('அளவு உள்ளிடவும்');return}
  if(cartMeta.pay==='credit'&&!ckey(cartMeta.cust)){toast('கடன் பில்லுக்கு வாடிக்கையாளர் பெயர் அவசியம்');return}
  var old=editNo?getBill(editNo):null;
  var need={};
  items.forEach(function(i){if(i.pid)need[i.pid]=(need[i.pid]||0)+num(i.qty)});
  if(old)old.items.forEach(function(i){if(i.pid)need[i.pid]=(need[i.pid]||0)-num(i.qty)});
  var short=[];
  Object.keys(need).forEach(function(id){
    var p=findP(id);
    if(p&&isTracked(p)&&need[id]>0&&p.stock-need[id]<0)short.push(p.name+' ('+q(p.stock)+' '+UNITS[p.unit]+' மட்டுமே)');
  });
  if(short.length&&!(await ask('சரக்கு போதாது: '+short.join(', ')+'. இருந்தாலும் பில் போடவா?','பில் போடு')))return;
  var sub=items.reduce(function(s,i){return s+i.qty*i.price},0),disc=Math.min(num(cartMeta.disc),sub);
  var b={no:editNo||DB.nextNo,ts:editTs||Date.now(),
    items:items.map(function(i){return{pid:i.pid||null,name:i.name,unit:i.unit,price:num(i.price),cost:num(i.cost),qty:num(i.qty)}}),
    sub:sub,disc:disc,total:sub-disc,cust:cartMeta.cust.trim(),phone:cartMeta.phone.trim(),pay:cartMeta.pay};
  if(b.cust&&cleanPhone(b.phone)){DB.phones[ckey(b.cust)]=cleanPhone(b.phone)}
  if(old)old.items.forEach(function(i){adjStock(i.pid,num(i.qty))});
  b.items.forEach(function(i){adjStock(i.pid,-num(i.qty))});
  if(editNo){DB.bills=DB.bills.map(function(x){return x.no===editNo?b:x})}
  else{DB.bills.push(b);DB.nextNo++}
  save();cart=[];resetCartMeta();closeModal();
  if(tab==='bill')render();updateBar();
  showBill(b.no);
  var lw=b.items.map(function(i){return i.pid&&findP(i.pid)}).filter(function(p){return p&&isLow(p)});
  var msg=[];
  if(b.pay==='credit'){var cc=custMap()[ckey(b.cust)];if(cc)msg.push('📒 '+cc.name+' மொத்த பாக்கி '+money(cc.bal))}
  if(lw.length)msg.push('⚠️ குறைவு: '+lw.map(function(p){return p.name}).join(', '));
  if(b.phone&&!cleanPhone(b.phone))msg.push('📵 போன் எண் சரியில்லை');
  else if(autoBillSms(b))msg.push('📱 SMS தயார் — Send அழுத்துங்க');
  toast(msg.length?msg.join('  |  '):'பில் சேமிக்கப்பட்டது');
}

/* ---------- RECEIPT ---------- */
function getBill(no){return DB.bills.filter(function(b){return b.no===no})[0]}
function receiptHtml(b){
  var rows=b.items.map(function(i){
    return '<tr><td>'+esc(i.name)+'<br>&nbsp;&nbsp;'+qtyTxt(i.qty,i.unit)+' × '+money(i.price)+'</td><td class="r">'+money(i.qty*i.price)+'</td></tr>';
  }).join('');
  return '<div class="rc"><div class="c"><b>'+esc(DB.shop.name)+'</b>'+(DB.shop.addr?'<br>'+esc(DB.shop.addr):'')+(DB.shop.phone?'<br>📞 '+esc(DB.shop.phone):'')+'</div><hr>'+
   '<table><tr><td>பில் எண்: <b>'+b.no+'</b></td><td class="r">'+dstr(b.ts)+' '+tstr(b.ts)+'</td></tr>'+
   (b.cust?'<tr><td colspan="2">வாடிக்கையாளர்: '+esc(b.cust)+(b.phone?' · '+esc(b.phone):'')+'</td></tr>':'')+'</table><hr>'+
   '<table>'+rows+'</table><hr><table>'+
   (b.disc>0?'<tr><td>கூட்டுத்தொகை</td><td class="r">'+money(b.sub)+'</td></tr><tr><td>தள்ளுபடி</td><td class="r">- '+money(b.disc)+'</td></tr>':'')+
   '<tr><td><b>மொத்தம்</b></td><td class="r"><b>'+money(b.total)+'</b></td></tr><tr><td>முறை</td><td class="r">'+PAY[b.pay]+'</td></tr></table><hr>'+
   '<div class="c">'+esc(DB.shop.footer||'')+'</div></div>';
}
function billText(b){
  var L=['*'+DB.shop.name+'*'];
  if(DB.shop.addr)L.push(DB.shop.addr);
  if(DB.shop.phone)L.push('Ph: '+DB.shop.phone);
  L.push('--------------------');
  L.push('பில் எண்: '+b.no+'   '+dstr(b.ts)+' '+tstr(b.ts));
  if(b.cust)L.push('வாடிக்கையாளர்: '+b.cust);
  L.push('--------------------');
  b.items.forEach(function(i){L.push(i.name+'\n   '+qtyTxt(i.qty,i.unit)+' × '+i.price+' = '+money(i.qty*i.price))});
  L.push('--------------------');
  if(b.disc>0){L.push('கூட்டுத்தொகை: '+money(b.sub));L.push('தள்ளுபடி: -'+money(b.disc))}
  L.push('*மொத்தம்: '+money(b.total)+'*');
  L.push('முறை: '+PAY[b.pay]);
  if(DB.shop.footer)L.push('',DB.shop.footer);
  return L.join('\n');
}
function showBill(no){
  var b=getBill(no);if(!b)return;
  modal('<h3>பில் #'+b.no+'</h3>'+receiptHtml(b)+
   '<div class="btns"><button class="btn" onclick="shareBill('+no+')">📤 அனுப்பு</button><button class="btn" onclick="printBill('+no+')">🖨️ பிரிண்ட்</button></div>'+
   (cleanPhone(b.phone)?'<div class="btns"><button class="btn ghost" onclick="sendBillTo('+no+',\'sms\')">📱 SMS</button><button class="btn ghost" onclick="sendBillTo('+no+',\'wa\')">💬 WhatsApp</button></div>':'')+
   '<div class="btns"><button class="btn ghost" onclick="editBill('+no+')">✏️ திருத்து</button><button class="btn red" onclick="delBill('+no+')">🗑️ நீக்கு</button></div>'+
   '<button class="btn line full" onclick="closeModal()">மூடு</button>');
}
function shareBill(no){var b=getBill(no);if(!b)return;if(window.Android)Android.share(billText(b));else{try{navigator.clipboard.writeText(billText(b));toast('நகலெடுக்கப்பட்டது')}catch(e){}}}
function printBill(no){var b=getBill(no);if(!b)return;$('#printArea').innerHTML=receiptHtml(b);if(window.Android)Android.print();else window.print()}
async function delBill(no){
  var ob=getBill(no);
  if(ob&&await ask('பில் #'+no+' நிரந்தரமாக நீக்கவா? (பொருட்கள் சரக்கில் திரும்பச் சேரும்)','நீக்கு')){
    ob.items.forEach(function(i){adjStock(i.pid,num(i.qty))});
    DB.bills=DB.bills.filter(function(b){return b.no!==no});save();closeModal();toast('பில் நீக்கப்பட்டது');render();
  }
}
async function editBill(no){
  var b=getBill(no);if(!b)return;
  if(cart.length&&!(await ask('தற்போதைய பில்லில் உள்ள பொருட்கள் மாறிவிடும். தொடரவா?','தொடர்')))return;
  cart=b.items.map(function(i){return{pid:i.pid||null,name:i.name,unit:i.unit,price:i.price,cost:i.cost||0,qty:i.qty}});
  cartMeta={disc:b.disc,cust:b.cust,phone:b.phone,pay:b.pay};editNo=b.no;editTs=b.ts;
  closeModal();openCart();
}

/* ---------- PRODUCTS TAB ---------- */

   '<div class="stat"><div><small>எதிர்பார்க்கும் லாபம்</small><b>'+money(S.saleV-S.costV)+'</b></div>'+
   '<div class="'+(S.low?'warn':'')+'"><small>குறைவு / தீர்ந்தது</small><b>'+S.low+'</b></div></div>'+

   '<p style="color:var(--mu);font-size:12px">சரக்கு மதிப்பு = இருப்பு × வாங்கிய விலை (வாங்கிய விலை இல்லையென்றால் விற்கும் விலை). இருப்பு கொடுத்த பொருட்கள் மட்டும் கணக்கிடப்படும்.</p>';
  document.querySelectorAll('.chip[data-m]').forEach(function(c){
    c.classList.toggle('on',c.dataset.m===st.mf);
    c.onclick=function(){st.mf=c.dataset.m;rProducts()};
  });
  $('#mq').oninput=function(){st.mq=this.value;fillMlist()};

function fillMlist(){
  var k=st.mq.trim().toLowerCase();
  var l=sortedProducts().filter(function(p){return p.name.toLowerCase().indexOf(k)>=0&&(st.mf!=='low'||isLow(p))});
  $('#mlist').innerHTML=l.length?l.map(function(p){
    return '<div class="row'+(isLow(p)?' lowrow':'')+'"><div class="t"><b>'+esc(p.name)+'</b><small>'+money(p.price)+' / '+UNITS[p.unit]+(num(p.cost)>0?' · வாங்கியது '+money(p.cost)+' · லாபம் '+money(p.price-p.cost)+' / '+UNITS[p.unit]:'')+'</small>'+stockLine(p)+'</div>'+
      '<button class="ico" onclick="stockForm(\''+p.id+'\')">📥</button><button class="ico" onclick="prodForm(\''+p.id+'\')">✏️</button><button class="ico" onclick="delProd(\''+p.id+'\')">🗑️</button></div>';
  }).join(''):'<div class="empty">'+(st.mf==='low'?'குறைவான பொருள் எதுவும் இல்லை 👍':'பொருள் இல்லை. மேலே "புதிய பொருள்" அழுத்தவும்.')+'</div>';
}
function prodForm(id){
  var p=id?findP(id):{name:'',price:'',unit:'kg',cost:'',min:5};

   '<label>பெயர்</label><input class="inp" id="fn" value="'+esc(p.name)+'">'+

}
function saveProd(id){
  var n=$('#fn').value.trim(),pr=num($('#fp').value),u=$('#fu').value,c=num($('#fc').value);
  var sv=$('#fs').value.trim(),mv=$('#fm').value.trim();
  if(!n){toast('பெயர் எழுதவும்');return}
  var p=id?findP(id):mk(n,pr,u);
  p.name=n;p.price=pr;p.unit=u;p.cost=c;
  if(sv===''){delete p.stock;delete p.min}else{p.stock=num(sv);p.min=mv===''?5:num(mv)}
  if(!id)DB.products.push(p);
  save();closeModal();render();toast('சேமிக்கப்பட்டது');
}
function unitOf(s){
  s=String(s||'').trim().toLowerCase();
  var m={kg:'kg','கிலோ':'kg',l:'L',litre:'L',liter:'L','லிட்டர்':'L',pcs:'pcs',pc:'pcs','எண்':'pcs',pkt:'pkt',packet:'pkt','பாக்கெட்':'pkt',dz:'dz',dozen:'dz','டஜன்':'dz'};
  return m[s]||'pcs';
}
function importForm(){
  modal('<h3>📋 பல பொருட்கள் ஒரே நேரத்தில்</h3>'+
   '<p style="margin:0 0 8px;color:var(--mu);font-size:14px">ஒவ்வொரு வரியும் ஒரு பொருள்:<br><b>பெயர், விலை, அலகு, வாங்கிய விலை, இருப்பு</b><br>அலகு: kg / L / pcs / pkt / dz (விட்டால் pcs). கடைசி மூன்றும் விருப்பம்.<br>உதாரணம்:<br>Arisi, 80, kg, 70, 25<br>Arasan soap, 36, pcs</p>'+
   '<textarea class="inp" id="itx" rows="9" placeholder="Arisi, 80, kg"></textarea>'+
   '<div class="btns"><button class="btn line" onclick="closeModal()">மூடு</button><button class="btn" onclick="doImport()">சேர்</button></div>');
}
function doImport(){
  var add=0,upd=0,bad=0;
  $('#itx').value.split(/\n/).forEach(function(L){
    L=L.trim();if(!L)return;
    var f=L.split(/[,\t]/).map(function(x){return x.trim()});
    var name=f[0],price=parseFloat(f[1]);
    if(!name||isNaN(price)){bad++;return}
    var u=unitOf(f[2]),cost=(f[3]!==undefined&&f[3]!=='')?num(f[3]):0,sv=(f[4]!==undefined&&f[4]!=='')?num(f[4]):undefined;
    var ex=DB.products.filter(function(p){return p.name.toLowerCase()===name.toLowerCase()})[0];
    if(ex){ex.price=price;ex.unit=u;if(cost)ex.cost=cost;if(sv!==undefined){ex.stock=sv;if(ex.min==null)ex.min=5}upd++}
    else{DB.products.push(mk(name,price,u,cost,sv,5));add++}
  });
  save();closeModal();render();
  toast(add+' சேர்க்கப்பட்டது, '+upd+' புதுப்பிக்கப்பட்டது'+(bad?', '+bad+' வரி தவறு':''));
}
function stockForm(id){

function doStock(id){
  var p=findP(id),n=num($('#sq').value),c=num($('#sc').value);

/* ---------- CREDIT (கடன்) ---------- */
function ckey(n){return String(n||'').trim().toLowerCase().replace(/\s+/g,' ')}
function ek(k){return encodeURIComponent(k).replace(/'/g,'%27')}
function custMap(){
  var m={};
  function g(n,ph){var k=ckey(n);if(!k)return null;return m[k]||(m[k]={key:k,name:String(n).trim(),phone:ph||'',bal:0,last:0,rows:[]})}
  DB.bills.forEach(function(b){
    if(b.pay!=='credit')return;
    var c=g(b.cust,b.phone);if(!c)return;
    c.bal+=b.total;c.last=Math.max(c.last,b.ts);if(b.phone)c.phone=b.phone;c.name=String(b.cust).trim();
    c.rows.push({t:'bill',ts:b.ts,amt:b.total,no:b.no});
  });
  (DB.led||[]).forEach(function(e){
    var c=g(e.name,e.phone);if(!c)return;
    if(e.kind==='pay')c.bal-=e.amt;else c.bal+=e.amt;
    c.last=Math.max(c.last,e.ts);if(e.phone&&!c.phone)c.phone=e.phone;
    c.rows.push({t:e.kind,ts:e.ts,amt:e.amt,id:e.id,note:e.note});
  });
  Object.keys(m).forEach(function(k){if(DB.phones&&DB.phones[k])m[k].phone=DB.phones[k]});
  return m;
}
function custNames(){
  var m=custMap(),seen={},out=[];
  Object.keys(m).forEach(function(k){out.push(m[k].name);seen[k]=1});
  DB.bills.forEach(function(b){var k=ckey(b.cust);if(k&&!seen[k]){seen[k]=1;out.push(b.cust.trim())}});
  return out.sort();
}
function rCredit(){
  var m=custMap(),arr=Object.keys(m).map(function(k){return m[k]});
  var owing=arr.filter(function(c){return c.bal>0.005});

  $('#main').innerHTML=
   '<div class="stat"><div class="big"><small>மொத்த கடன் பாக்கி</small><b>'+money(tot)+'</b></div><div><small>பாக்கி உள்ளவர்கள்</small><b>'+owing.length+'</b></div></div>'+
   '<div class="chips"><button class="chip" data-c="owe">பாக்கி உள்ளவர்கள்</button><button class="chip" data-c="all">எல்லோரும்</button></div>'+
   '<input class="inp" id="cq" placeholder="🔍 பெயர் / போன்" value="'+esc(st.cq)+'">'+
   '<button class="btn ghost full" onclick="oldForm()">➕ பழைய கடன் / புதிய நபர் சேர்</button><div class="list" id="clist"></div>'+
   '<p style="color:var(--mu);font-size:12px">"பில்" பகுதியில் பணம் செலுத்தும் முறையை <b>கடன்</b> என்று தேர்ந்தெடுத்து பில் போட்டால் இங்கே அவர் பெயரில் சேரும். பணம் வாங்கினால் அவர் பெயரைத் தொட்டு "பணம் பெற்றேன்" அழுத்தவும்.</p>';
  document.querySelectorAll('.chip[data-c]').forEach(function(c){
    c.classList.toggle('on',c.dataset.c===st.cf);
    c.onclick=function(){st.cf=c.dataset.c;rCredit()};
  });
  $('#cq').oninput=function(){st.cq=this.value;fillClist()};
  fillClist();
}
function fillClist(){
  var m=custMap(),k=st.cq.trim().toLowerCase();
  var l=Object.keys(m).map(function(x){return m[x]}).filter(function(c){
    if(st.cf==='owe'&&c.bal<=0.005)return false;
    return !k||(c.name.toLowerCase().indexOf(k)>=0||(c.phone||'').indexOf(k)>=0);
  }).sort(function(a,b){return b.bal-a.bal});
  $('#clist').innerHTML=l.length?l.map(function(c){
    var a=c.bal>0.005?'<span class="amt lowt">'+money(c.bal)+'</span>':(c.bal<-0.005?'<span class="amt okt">முன்பணம் '+money(-c.bal)+'</span>':'<span class="amt okt">✔ தீர்ந்தது</span>');
    return '<div class="row" onclick="custView(decodeURIComponent(\''+ek(c.key)+'\'))"><div class="t"><b>'+esc(c.name)+'</b><small>'+(c.phone?esc(c.phone)+' · ':'')+'கடைசி: '+dstr(c.last)+'</small></div>'+a+'</div>';
  }).join(''):'<div class="empty">'+(st.cf==='owe'?'யாருக்கும் பாக்கி இல்லை 👍':'யாரும் இல்லை.')+'</div>';

  modal('<h3>'+esc(c.name)+'</h3>'+(c.phone?'<div style="color:var(--mu);margin:-6px 0 8px">📞 '+esc(c.phone)+'</div>':'')+

   '<div class="btns"><button class="btn line" onclick="oldForm(decodeURIComponent(\''+ek(key)+'\'))">➕ கடன் சேர்</button><button class="btn line" onclick="closeModal()">மூடு</button></div>'+
   '<h4>கணக்கு விவரம்</h4><div class="list">'+(rows||'<div class="empty">பதிவு இல்லை.</div>')+'</div>');
}

function fillHist(){
  var today=dkey(Date.now()),k=st.hq.trim().toLowerCase();

    if(st.hf==='today'&&dkey(b.ts)!==today)return false;
    if(st.hf==='date'&&st.hd&&dkey(b.ts)!==st.hd)return false;
    if(k){var hay=(b.no+' '+(b.cust||'')+' '+(b.phone||'')).toLowerCase();if(hay.indexOf(k)<0)return false}
    return true;
  }).sort(function(a,b){return b.no-a.no});
  var tot=l.reduce(function(s,b){return s+b.total},0);
  $('#hsum').innerHTML='<div class="stat"><div class="big"><small>'+l.length+' பில்கள்</small><b>'+money(tot)+'</b></div></div>';
  $('#hlist').innerHTML=l.length?l.map(function(b){
    return '<div class="row" onclick="showBill('+b.no+')"><div class="t"><b>#'+b.no+(b.cust?' · '+esc(b.cust):'')+'</b><small>'+dstr(b.ts)+' '+tstr(b.ts)+' · '+PAY[b.pay]+' · '+b.items.length+' பொருள்</small></div><span class="amt">'+money(b.total)+'</span></div>';
  }).join(''):'<div class="empty">பில் எதுவும் இல்லை.</div>';
}

/* ---------- REPORT TAB ---------- */
function rReport(){
  var now=new Date(),mk0=now.getFullYear()+'-'+pad(now.getMonth()+1),today=dkey(Date.now());
  var l=DB.bills.filter(function(b){
    if(st.rp==='today')return dkey(b.ts)===today;
    if(st.rp==='month')return dkey(b.ts).slice(0,7)===mk0;
    return true;
  });
  var tot=l.reduce(function(s,b){return s+b.total},0),disc=l.reduce(function(s,b){return s+b.disc},0);
  var by={cash:0,upi:0,credit:0},items={},profit=0,hasCost=false;
  l.forEach(function(b){
    var bc=false;b.items.forEach(function(i){if(num(i.cost)>0){bc=true;hasCost=true;profit+=i.qty*(i.price-i.cost)}});
    if(bc)profit-=num(b.disc);
  });
  var S=stockStats();
  l.forEach(function(b){by[b.pay]=(by[b.pay]||0)+b.total;b.items.forEach(function(i){var o=items[i.name]||(items[i.name]={amt:0,qty:0,unit:i.unit});o.amt+=i.qty*i.price;o.qty+=i.qty})});
  var top=Object.keys(items).map(function(n){return{n:n,amt:items[n].amt,qty:items[n].qty,unit:items[n].unit}}).sort(function(a,b){return b.amt-a.amt}).slice(0,10);
  $('#main').innerHTML=
   '<div class="chips"><button class="chip" data-p="today">இன்று</button><button class="chip" data-p="month">இந்த மாதம்</button><button class="chip" data-p="all">எல்லாம்</button></div>'+
   '<div class="stat"><div class="big"><small>மொத்த விற்பனை</small><b>'+money(tot)+'</b></div><div><small>பில்கள்</small><b>'+l.length+'</b></div></div>'+
   '<div class="stat"><div><small>ரொக்கம்</small><b>'+money(by.cash)+'</b></div><div><small>UPI</small><b>'+money(by.upi)+'</b></div><div><small>கடன்</small><b>'+money(by.credit)+'</b></div></div>'+
   (disc>0?'<div class="stat"><div><small>மொத்த தள்ளுபடி</small><b>'+money(disc)+'</b></div></div>':'')+
   (hasCost?'<div class="stat"><div><small>மதிப்பிட்ட லாபம் (வாங்கிய விலை உள்ள பொருட்கள்)</small><b>'+money(profit)+'</b></div></div>':'')+
   '<h4>இப்போதைய நிலை</h4><div class="stat" onclick="go(\'credit\')"><div class="big"><small>மொத்த கடன் பாக்கி</small><b>'+money(credTot())+'</b></div></div><div class="stat" onclick="go(\'products\')"><div class="big"><small>சரக்கு மதிப்பு</small><b>'+money(S.costV)+'</b></div><div class="'+(S.low?'warn':'')+'"><small>குறைவு / தீர்ந்தது</small><b>'+S.low+'</b></div></div>'+
   '<h4>அதிகம் விற்ற பொருட்கள்</h4><div class="list">'+(top.length?top.map(function(t){
     return '<div class="row"><div class="t"><b>'+esc(t.n)+'</b><small>'+qtyTxt(t.qty,t.unit)+'</small></div><span class="amt">'+money(t.amt)+'</span></div>';
   }).join(''):'<div class="empty">தகவல் இல்லை.</div>')+'</div>';
  document.querySelectorAll('.chip[data-p]').forEach(function(c){
    c.classList.toggle('on',c.dataset.p===st.rp);
    c.onclick=function(){st.rp=c.dataset.p;rReport()};
  });
}

/* ---------- SETTINGS TAB ---------- */
function rSettings(){
  var s=DB.shop;
  $('#main').innerHTML=
   '<label>கடை பெயர்</label><input class="inp" id="sn" value="'+esc(s.name)+'">'+
   '<label>முகவரி</label><input class="inp" id="sa" value="'+esc(s.addr)+'">'+
   '<label>தொலைபேசி</label><input class="inp" id="sp" type="tel" value="'+esc(s.phone)+'">'+
   '<label>பில் கீழே எழுத்து</label><input class="inp" id="sf" value="'+esc(s.footer)+'">'+
   '<label>வாடிக்கையாளருக்கு பில் SMS</label><select class="inp" id="ss"><option value="credit">கடன் பில்லுக்கு மட்டும்</option><option value="all">எல்லா பில்லுக்கும் (போன் இருந்தால்)</option><option value="off">அனுப்ப வேண்டாம்</option></select>'+
   '<button class="btn full" onclick="saveShop()">சேமி</button>'+
   '<h4>பேக்கப் (தகவல் பாதுகாப்பு)</h4>'+
   '<button class="btn ghost full" onclick="backup()">📤 பேக்கப் எடு (WhatsApp / Drive-ல் சேமி)</button>'+
   '<button class="btn ghost full" onclick="restoreForm()">📥 பேக்கப்பிலிருந்து மீட்டெடு</button>'+
   '<h4>ஆபத்தான பகுதி</h4>'+
   '<button class="btn red full" onclick="wipeBills()">எல்லா பில்களையும் நீக்கு</button>'+
   '<p style="color:var(--mu);font-size:13px">மொத்தம் '+DB.bills.length+' பில்கள், '+DB.products.length+' பொருட்கள் சேமிக்கப்பட்டுள்ளன. மொபைல் மாற்றும் முன் பேக்கப் எடுக்கவும்.</p>';
  $('#ss').value=smsMode();
}
function saveShop(){
  DB.shop={name:$('#sn').value.trim()||'மளிகை கடை',addr:$('#sa').value.trim(),phone:$('#sp').value.trim(),footer:$('#sf').value.trim(),sms:$('#ss').value};
  save();render();toast('சேமிக்கப்பட்டது');
}
function backup(){
  var t=JSON.stringify(DB);
  if(window.Android)Android.share(t);else{try{navigator.clipboard.writeText(t);toast('நகலெடுக்கப்பட்டது')}catch(e){}}
}
function restoreForm(){
  modal('<h3>பேக்கப் மீட்டெடு</h3><p style="margin:0 0 8px;color:var(--mu)">பேக்கப் எடுத்த முழு எழுத்தையும் இங்கே paste செய்யவும். தற்போதைய தகவல் மாறிவிடும்.</p>'+
   '<textarea class="inp" id="rt" rows="8"></textarea>'+
   '<div class="btns"><button class="btn line" onclick="closeModal()">மூடு</button><button class="btn" onclick="doRestore()">மீட்டெடு</button></div>');
}
async function doRestore(){
  try{
    var d=JSON.parse($('#rt').value.trim());
    if(!d||!Array.isArray(d.products)||!Array.isArray(d.bills)||!d.shop)throw 0;
    if(!(await ask('தற்போதைய தகவல் அழிந்து பேக்கப் தகவல் வரும். தொடரவா?','மீட்டெடு')))return;
    DB=d;if(!DB.led)DB.led=[];if(!DB.phones)DB.phones={};DB.setup=true;if(!DB.nextNo)DB.nextNo=DB.bills.reduce(function(m,b){return Math.max(m,b.no)},0)+1;
    save();cart=[];resetCartMeta();closeModal();render();toast('மீட்டெடுக்கப்பட்டது');
  }catch(e){toast('பேக்கப் எழுத்து சரியில்லை')}
}
async function wipeBills(){
  if(await ask('எல்லா பில்களும் நிரந்தரமாக அழியும். உறுதியா?','நீக்கு')){
    DB.bills=[];DB.nextNo=1;save();render();toast('நீக்கப்பட்டது');
  }
}

function setupForm(){
  var s=DB.shop;
  modal('<h3>🛒 உங்கள் கடை பெயர்</h3><p style="margin:0 0 8px;color:var(--mu)">இது ஆப் மேலே, பில்லில், SMS-ல் வரும்.</p>'+
   '<label>கடை பெயர்</label><input class="inp" id="un" value="'+esc(s.name)+'">'+
   '<label>முகவரி</label><input class="inp" id="ua" value="'+esc(s.addr)+'">'+
   '<label>தொலைபேசி</label><input class="inp" id="up" type="tel" value="'+esc(s.phone)+'">'+
   '<div class="btns"><button class="btn line" onclick="closeModal()">பிறகு</button><button class="btn" onclick="doSetup()">தொடங்கு</button></div>');
}
function doSetup(){
  var n=$('#un').value.trim();if(!n){toast('கடை பெயர் எழுதவும்');return}
  DB.shop.name=n;DB.shop.addr=$('#ua').value.trim();DB.shop.phone=$('#up').value.trim();DB.setup=true;
  save();closeModal();render();
}
go('bill');
if(!DB.setup)setupForm();
</script>
</body>
</html>
